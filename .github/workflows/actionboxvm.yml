name: ActionBoxVM

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

permissions:
  contents: write

jobs:
  actionboxvm:
    name: ActionBoxVM
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install ActionBoxVM
        run: |
          set -e

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            fluxbox \
            xterm \
            xvfb \
            x11vnc \
            novnc \
            websockify \
            xdotool \
            x11-utils \
            imagemagick \
            lolcat \
            fortune-mod \
            curl \
            wget \
            git \
            nano \
            vim \
            less \
            tree \
            htop \
            btop \
            jq \
            zip \
            unzip \
            file \
            procps \
            psmisc \
            pciutils \
            usbutils \
            ca-certificates \
            dnsutils \
            iproute2 \
            iputils-ping \
            net-tools \
            tar \
            gzip \
            bzip2 \
            xz-utils \
            python3 \
            python3-pip \
            python3-venv \
            python3-dev \
            build-essential \
            dbus-x11

      - name: Prepare ActionBoxVM files
        run: |
          set -e

          mkdir -p actionboxvm
          mkdir -p /tmp/actionboxvm

          chmod +x actionboxvm/status.sh
          chmod +x actionboxvm/screenshot.sh

          test -f actionboxvm/status.sh
          test -f actionboxvm/screenshot.sh
          test -f actionboxvm/screenshot-worker.py

      - name: Configure Fluxbox
        run: |
          set -e

          mkdir -p "$HOME/.fluxbox"

          cat > "$HOME/.fluxbox/init" <<'EOF'
          session.screen0.toolbar.visible: true
          session.screen0.toolbar.placement: BottomCenter
          session.screen0.toolbar.height: 22
          session.screen0.toolbar.widthPercent: 100
          session.screen0.workspaces: 1
          session.screen0.menuDelay: 0
          session.screen0.focusNewWindows: true
          session.screen0.focusModel: ClickFocus
          session.screen0.fullMaximization: true
          session.screen0.maxDisableMove: false
          session.screen0.maxDisableResize: false
          EOF

          cat > "$HOME/.fluxbox/menu" <<'EOF'
          [begin] (ActionBoxVM)

          [exec] (Terminal) {xterm}

          [separator]

          [exec] (Python 3) {xterm -e python3}

          [exec] (System Monitor) {xterm -e htop}

          [exec] (Btop) {xterm -e btop}

          [exec] (Processes) {xterm -e bash -c 'ps aux --forest; echo; exec bash'}

          [exec] (Git Status) {xterm -e bash -c 'git status; echo; exec bash'}

          [exec] (System Information) {xterm -e bash -c 'uname -a; echo; cat /etc/os-release; echo; exec bash'}

          [exec] (Disk Usage) {xterm -e bash -c 'df -h; echo; exec bash'}

          [exec] (Network Information) {xterm -e bash -c 'ip addr; echo; exec bash'}

          [separator]

          [exec] (About ActionBoxVM) {xmessage -center "ActionBoxVM\n\nUbuntu + Fluxbox + Xvfb + noVNC\nPowered by GitHub Actions"}

          [separator]

          [exit] (Exit)
          EOF

      - name: Start Xvfb
        run: |
          set -e

          Xvfb :99 \
            -screen 0 1280x720x24 \
            -ac \
            +extension GLX \
            +render \
            > /tmp/actionboxvm-xvfb.log 2>&1 &

          echo $! > /tmp/actionboxvm-xvfb.pid

          sleep 2

          if ! kill -0 "$(cat /tmp/actionboxvm-xvfb.pid)" 2>/dev/null; then
            echo "Xvfb failed to start."
            cat /tmp/actionboxvm-xvfb.log || true
            exit 1
          fi

      - name: Start Fluxbox
        env:
          DISPLAY: :99
        run: |
          set -e

          fluxbox \
            > /tmp/actionboxvm-fluxbox.log 2>&1 &

          echo $! > /tmp/actionboxvm-fluxbox.pid

          sleep 2

          if ! kill -0 "$(cat /tmp/actionboxvm-fluxbox.pid)" 2>/dev/null; then
            echo "Fluxbox failed to start."
            cat /tmp/actionboxvm-fluxbox.log || true
            exit 1
          fi

      - name: Start ActionBoxVM terminal
        env:
          DISPLAY: :99
        run: |
          set -e

          xterm \
            -title "ActionBoxVM" \
            -geometry 72x20+20+20 \
            -fa "Monospace" \
            -fs 11 \
            -bg "#111111" \
            -fg "#eeeeee" \
            -sb \
            -rightbar \
            -e ./actionboxvm/status.sh \
            > /tmp/actionboxvm-xterm.log 2>&1 &

          echo $! > /tmp/actionboxvm-xterm.pid

          for i in {1..20}; do
            if xdotool search \
              --name "^ActionBoxVM$" \
              >/dev/null 2>&1; then
              echo "ActionBoxVM terminal is running."
              exit 0
            fi

            sleep 1
          done

          echo "ActionBoxVM terminal was not detected."
          cat /tmp/actionboxvm-xterm.log || true
          exit 1

      - name: Start local VNC backend
        env:
          DISPLAY: :99
        run: |
          set -e

          x11vnc \
            -display :99 \
            -rfbport 5900 \
            -listen 127.0.0.1 \
            -forever \
            -shared \
            -nopw \
            -xkb \
            -noxrecord \
            -noxfixes \
            -noxdamage \
            > /tmp/actionboxvm-rfb.log 2>&1 &

          echo $! > /tmp/actionboxvm-rfb.pid

          sleep 3

          if ! kill -0 "$(cat /tmp/actionboxvm-rfb.pid)" 2>/dev/null; then
            echo "Local VNC backend failed."
            cat /tmp/actionboxvm-rfb.log || true
            exit 1
          fi

      - name: Start noVNC
        run: |
          set -e

          websockify \
            --web=/usr/share/novnc \
            6080 \
            127.0.0.1:5900 \
            > /tmp/actionboxvm-novnc.log 2>&1 &

          echo $! > /tmp/actionboxvm-novnc.pid

          sleep 3

          if ! kill -0 "$(cat /tmp/actionboxvm-novnc.pid)" 2>/dev/null; then
            echo "noVNC failed to start."
            cat /tmp/actionboxvm-novnc.log || true
            exit 1
          fi

          curl \
            --fail \
            --silent \
            --show-error \
            http://127.0.0.1:6080/vnc.html \
            >/dev/null

          echo "noVNC is responding."
      - name: Install Cloudflare Tunnel
        run: |
          set -e

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb \
            --output /tmp/cloudflared.deb

          sudo dpkg -i /tmp/cloudflared.deb

          cloudflared --version

      - name: Start Cloudflare Tunnel
        run: |
          set -e

          cloudflared tunnel \
            --url http://127.0.0.1:6080 \
            --no-autoupdate \
            --loglevel info \
            > /tmp/actionboxvm-cloudflared.log 2>&1 &

          echo $! > /tmp/actionboxvm-cloudflared.pid

          TUNNEL_URL=""

          for i in {1..60}; do
            TUNNEL_URL="$(
              grep -oE \
                'https://[A-Za-z0-9.-]+\.trycloudflare\.com' \
                /tmp/actionboxvm-cloudflared.log \
                | head -n 1 \
                || true
            )"

            if [ -n "$TUNNEL_URL" ]; then
              break
            fi

            sleep 2
          done

          if [ -z "$TUNNEL_URL" ]; then
            echo "Cloudflare Tunnel URL was not found."
            cat /tmp/actionboxvm-cloudflared.log || true
            exit 1
          fi

          TUNNEL_NOVNC="${TUNNEL_URL}/vnc.html?autoconnect=true&resize=remote"

          export TUNNEL_URL
          export TUNNEL_NOVNC

          echo "TUNNEL_URL=$TUNNEL_URL" >> "$GITHUB_ENV"
          echo "TUNNEL_NOVNC=$TUNNEL_NOVNC" >> "$GITHUB_ENV"

      - name: Create actionbox.desktop
        env:
          TUNNEL_NOVNC: ${{ env.TUNNEL_NOVNC }}
        run: |
          set -e

          cat > actionbox.desktop <<EOF
          [Desktop Entry]
          Version=1.0
          Type=Link
          Name=ActionBoxVM
          Comment=Open the ActionBoxVM desktop
          URL=$TUNNEL_NOVNC
          Icon=computer
          EOF

      - name: Create initial status.json
        env:
          TUNNEL_NOVNC: ${{ env.TUNNEL_NOVNC }}
        run: |
          set -e

          export TIMESTAMP_VALUE="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          repository = os.environ["GITHUB_REPOSITORY"]
          branch = os.environ["GITHUB_REF_NAME"]
          run_id = os.environ["GITHUB_RUN_ID"]
          workflow = os.environ.get("GITHUB_WORKFLOW", "ActionBoxVM")
          novnc = os.environ["TUNNEL_NOVNC"]
          timestamp = os.environ["TIMESTAMP_VALUE"]

          data = {
              "project": "ActionBoxVM",
              "status": "online",

              "environment": {
                  "os": "Ubuntu",
                  "desktop": "Fluxbox",
                  "display": "Xvfb :99",
                  "resolution": "1280x720",
                  "terminal": "Xterm"
              },

              "tools": [
                  "Git",
                  "Python 3",
                  "nano",
                  "Vim",
                  "curl",
                  "wget",
                  "jq",
                  "tree",
                  "htop",
                  "btop",
                  "zip",
                  "unzip"
              ],

              "services": {
                  "noVNC": {
                      "enabled": True,
                      "url": novnc
                  },
                  "vnc": {
                      "enabled": True,
                      "address": "127.0.0.1:5900"
                  },
                  "cloudflare": {
                      "enabled": True,
                      "type": "Quick Tunnel"
                  }
              },

              "github": {
                  "repository": repository,
                  "branch": branch,
                  "workflow": workflow,
                  "run_id": run_id,
                  "run_url": (
                      f"https://github.com/{repository}"
                      f"/actions/runs/{run_id}"
                  )
              },

              "files": {
                  "screenshot": {
                      "path": "0.png",
                      "raw_url": (
                          f"https://raw.githubusercontent.com/"
                          f"{repository}/{branch}/0.png"
                      ),
                      "refresh_seconds": 300
                  },
                  "status": {
                      "path": "status.json"
                  },
                  "desktop_entry": {
                      "path": "actionbox.desktop"
                  }
              },

              "lifetime": {
                  "vm_refresh_hours": 12,
                  "screenshot_refresh_minutes": 5
              },

              "updated": timestamp
          }

          Path("status.json").write_text(
              json.dumps(data, indent=2) + "\n",
              encoding="utf-8"
          )
          PY

      - name: Capture initial screenshot
        env:
          DISPLAY: :99
        run: |
          set -e

          import \
            -display :99 \
            -window root \
            -quality 92 \
            0.png

          test -s 0.png

      - name: Update README access links
        env:
          TUNNEL_NOVNC: ${{ env.TUNNEL_NOVNC }}
        run: |
          set -e

          if [ ! -f README.md ]; then
            exit 0
          fi

          python3 <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")

          novnc = os.environ["TUNNEL_NOVNC"]

          text, _ = re.subn(
              r"\[noVNC\]\([^)]*\)",
              f"[noVNC]({novnc})",
              text,
              count=1
          )

          text, _ = re.subn(
              r"\[VNC\]\([^)]*\)",
              "[VNC](#vnc)",
              text,
              count=1
          )

          path.write_text(text, encoding="utf-8")
          PY

      - name: Publish initial state
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add 0.png
          git add status.json
          git add actionbox.desktop

          if [ -f README.md ]; then
            git add README.md
          fi

          if git diff --cached --quiet; then
            echo "Nothing to publish."
          else
            git commit -m "chore: start ActionBoxVM"
            git push
          fi

      - name: Start screenshot service
        env:
          DISPLAY: :99
        run: |
          set -e

          rm -f /tmp/actionboxvm/screenshot-worker.pid
          rm -f /tmp/actionboxvm/screenshot-worker.log

          ./actionboxvm/screenshot.sh \
            > /tmp/actionboxvm/screenshot-supervisor.log 2>&1 &

          SCREENSHOT_LAUNCHER_PID=$!

          echo "$SCREENSHOT_LAUNCHER_PID" \
            > /tmp/actionboxvm/screenshot-supervisor.pid

          for i in {1..20}; do
            if [ -f /tmp/actionboxvm/screenshot-worker.pid ]; then
              SCREENSHOT_PID="$(
                cat /tmp/actionboxvm/screenshot-worker.pid
              )"

              if kill -0 "$SCREENSHOT_PID" 2>/dev/null; then
                echo "Screenshot worker started."
                echo "PID: $SCREENSHOT_PID"
                exit 0
              fi
            fi

            sleep 1
          done

          echo "Screenshot worker failed to start."
          echo
          cat /tmp/actionboxvm/screenshot-supervisor.log || true
          echo
          cat /tmp/actionboxvm/screenshot-worker.log || true
          exit 1
      - name: Start status service
        env:
          DISPLAY: :99
        run: |
          set -e

          ./actionboxvm/status.sh \
            > /tmp/actionboxvm/status.log 2>&1 &

          STATUS_PID=$!

          echo "$STATUS_PID" \
            > /tmp/actionboxvm/status.pid

          sleep 2

          if ! kill -0 "$STATUS_PID" 2>/dev/null; then
            echo "Status service failed to start."
            cat /tmp/actionboxvm/status.log || true
            exit 1
          fi

          echo "Status service started."
          echo "PID: $STATUS_PID"

      - name: Keep ActionBoxVM running
        env:
          DISPLAY: :99
        run: |
          set -e

          echo
          echo "============================================================"
          echo "                       ActionBoxVM"
          echo "============================================================"
          echo
          echo "Status: ONLINE"
          echo
          echo "noVNC:"
          echo "$TUNNEL_NOVNC"
          echo
          echo "Screenshot:"
          echo "0.png refreshes every 5 minutes."
          echo
          echo "Status:"
          echo "status.json refreshes with the screenshot service."
          echo
          echo "VM:"
          echo "A fresh environment starts every 12 hours."
          echo
          echo "============================================================"
          echo

          while true; do

            if [ ! -f /tmp/actionboxvm-xvfb.pid ]; then
              echo "Xvfb PID file is missing."
              exit 1
            fi

            if ! kill -0 \
              "$(cat /tmp/actionboxvm-xvfb.pid)" \
              2>/dev/null; then
              echo "Xvfb stopped."
              exit 1
            fi

            if [ ! -f /tmp/actionboxvm-rfb.pid ]; then
              echo "VNC PID file is missing."
              exit 1
            fi

            if ! kill -0 \
              "$(cat /tmp/actionboxvm-rfb.pid)" \
              2>/dev/null; then
              echo "Local VNC backend stopped."
              exit 1
            fi

            if [ ! -f /tmp/actionboxvm-novnc.pid ]; then
              echo "noVNC PID file is missing."
              exit 1
            fi

            if ! kill -0 \
              "$(cat /tmp/actionboxvm-novnc.pid)" \
              2>/dev/null; then
              echo "noVNC stopped."
              exit 1
            fi

            if [ ! -f /tmp/actionboxvm-cloudflared.pid ]; then
              echo "Cloudflare PID file is missing."
              exit 1
            fi

            if ! kill -0 \
              "$(cat /tmp/actionboxvm-cloudflared.pid)" \
              2>/dev/null; then
              echo "Cloudflare Tunnel stopped."
              exit 1
            fi

            if [ ! -f /tmp/actionboxvm/screenshot-worker.pid ]; then
              echo "Screenshot worker PID file is missing."
              exit 1
            fi

            SCREENSHOT_PID="$(
              cat /tmp/actionboxvm/screenshot-worker.pid
            )"

            if ! kill -0 "$SCREENSHOT_PID" 2>/dev/null; then
              echo "Screenshot worker stopped."

              echo
              echo "Screenshot worker log:"
              cat \
                /tmp/actionboxvm/screenshot-worker.log \
                2>/dev/null || true

              echo
              echo "Screenshot supervisor log:"
              cat \
                /tmp/actionboxvm/screenshot-supervisor.log \
                2>/dev/null || true

              exit 1
            fi

            if [ ! -f /tmp/actionboxvm/status.pid ]; then
              echo "Status service PID file is missing."
              exit 1
            fi

            STATUS_PID="$(
              cat /tmp/actionboxvm/status.pid
            )"

            if ! kill -0 "$STATUS_PID" 2>/dev/null; then
              echo "Status service stopped."
              exit 1
            fi

            sleep 60

          done