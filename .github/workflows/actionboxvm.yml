      - name: Create actionbox.desktop
        env:
          TUNNEL_NOVNC: ${{ env.TUNNEL_NOVNC }}
        run: |
          set -e

          cat > actionbox.desktop <<EOF
          [Desktop Entry]
          Version=1.0
          Type=Link
          Name=ActionBoxVM
          Comment=Open the ActionBoxVM desktop
          URL=$TUNNEL_NOVNC
          Icon=computer
          EOF

          echo "actionbox.desktop created."

      - name: Create status.json
        env:
          TUNNEL_NOVNC: ${{ env.TUNNEL_NOVNC }}
        run: |
          set -e

          TIMESTAMP_VALUE="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          export TIMESTAMP_VALUE

          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          repository = os.environ["GITHUB_REPOSITORY"]
          branch = os.environ["GITHUB_REF_NAME"]
          run_id = os.environ["GITHUB_RUN_ID"]
          workflow = os.environ.get(
              "GITHUB_WORKFLOW",
              "ActionBoxVM",
          )
          novnc = os.environ["TUNNEL_NOVNC"]
          timestamp = os.environ["TIMESTAMP_VALUE"]

          data = {
              "project": "ActionBoxVM",
              "status": "online",

              "environment": {
                  "os": "Ubuntu",
                  "desktop": "Fluxbox",
                  "display": "Xvfb :99",
                  "resolution": "1280x720",
                  "terminal": "Xterm",
              },

              "tools": [
                  "Git",
                  "Python 3",
                  "nano",
                  "Vim",
                  "curl",
                  "wget",
                  "jq",
                  "tree",
                  "htop",
                  "btop",
                  "zip",
                  "unzip",
              ],

              "services": {
                  "vnc": {
                      "enabled": True,
                      "host": "127.0.0.1",
                      "port": 5900,
                      "public": False,
                  },

                  "noVNC": {
                      "enabled": True,
                      "url": novnc,
                  },

                  "cloudflare": {
                      "enabled": True,
                      "type": "Quick Tunnel",
                  },
              },

              "github": {
                  "repository": repository,
                  "branch": branch,
                  "workflow": workflow,
                  "run_id": run_id,
                  "run_url": (
                      f"https://github.com/"
                      f"{repository}/actions/runs/{run_id}"
                  ),
              },

              "files": {
                  "screenshot": {
                      "path": "0.png",
                      "raw_url": (
                          f"https://raw.githubusercontent.com/"
                          f"{repository}/{branch}/0.png"
                      ),
                      "refresh_seconds": 300,
                  },

                  "status": {
                      "path": "status.json",
                      "refresh_seconds": 300,
                  },

                  "desktop_entry": {
                      "path": "actionbox.desktop",
                  },
              },

              "lifetime": {
                  "vm_refresh_hours": 12,
                  "screenshot_refresh_minutes": 5,
              },

              "updated": timestamp,
          }

          Path("status.json").write_text(
              json.dumps(
                  data,
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )

          print("status.json created.")
          PY

      - name: Capture initial screenshot
        env:
          DISPLAY: :99
        run: |
          set -e

          import \
            -display :99 \
            -window root \
            -quality 92 \
            0.png

          test -s 0.png

          echo "Initial screenshot captured."

      - name: Update README access links
        env:
          TUNNEL_NOVNC: ${{ env.TUNNEL_NOVNC }}
        run: |
          set -e

          if [ ! -f README.md ]; then
            echo "README.md not found."
            exit 0
          fi

          python3 <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")

          novnc = os.environ["TUNNEL_NOVNC"]

          text, no_vnc_count = re.subn(
              r"\[noVNC\]\([^)]*\)",
              f"[noVNC]({novnc})",
              text,
              count=1,
          )

          text, vnc_count = re.subn(
              r"\[VNC\]\([^)]*\)",
              "[VNC](#no-raw-vnc)",
              text,
              count=1,
          )

          path.write_text(
              text,
              encoding="utf-8",
          )

          print(
              f"Updated noVNC markers: {no_vnc_count}"
          )

          print(
              f"Updated VNC markers: {vnc_count}"
          )
          PY

      - name: Publish initial ActionBoxVM state
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add 0.png
          git add status.json
          git add actionbox.desktop
          git add actionboxvm/status.sh
          git add actionboxvm/screenshot.sh
          git add actionboxvm/screenshot-worker.py

          if [ -f README.md ]; then
            git add README.md
          fi

          if git diff --cached --quiet; then
            echo "Nothing to publish."
          else
            git commit -m "chore: start ActionBoxVM"
            git push
          fi

      - name: Start screenshot service
        env:
          DISPLAY: :99
          TUNNEL_NOVNC: ${{ env.TUNNEL_NOVNC }}
        run: |
          set -e

          mkdir -p /tmp/actionboxvm

          chmod +x actionboxvm/screenshot.sh
          chmod +x actionboxvm/screenshot-worker.py

          rm -f /tmp/actionboxvm/screenshot-worker.pid

          echo "Starting ActionBoxVM screenshot service..."

          actionboxvm/screenshot.sh \
            >/tmp/actionboxvm/screenshot-supervisor.log 2>&1 &

          SCREENSHOT_SUPERVISOR_PID=$!

          echo "$SCREENSHOT_SUPERVISOR_PID" \
            >/tmp/actionboxvm/screenshot-supervisor.pid

          for i in {1..30}; do
            if [ -f /tmp/actionboxvm/screenshot-worker.pid ]; then
              break
            fi

            sleep 1
          done

          if [ ! -f /tmp/actionboxvm/screenshot-worker.pid ]; then
            echo "Screenshot worker failed to start."

            echo
            echo "Supervisor log:"
            cat /tmp/actionboxvm/screenshot-supervisor.log || true

            echo
            echo "Worker log:"
            cat /tmp/actionboxvm/screenshot-worker.log || true

            exit 1
          fi

          SCREENSHOT_PID="$(
            cat /tmp/actionboxvm/screenshot-worker.pid
          )"

          if ! kill -0 "$SCREENSHOT_PID" 2>/dev/null; then
            echo "Screenshot worker is not running."

            echo
            cat /tmp/actionboxvm/screenshot-worker.log || true

            exit 1
          fi

          echo "Screenshot worker is running."
          echo "PID: $SCREENSHOT_PID"
          echo
          echo "ActionBoxVM:"
          echo "$TUNNEL_NOVNC"

      - name: Display ActionBoxVM information
        run: |
          echo
          echo "============================================================"
          echo "                       ActionBoxVM"
          echo "============================================================"
          echo
          echo "Status: ONLINE"
          echo
          echo "noVNC:"
          echo "${TUNNEL_NOVNC}"
          echo
          echo "Screenshot:"
          echo "0.png and status.json refresh every 5 minutes."
          echo
          echo "VM:"
          echo "A fresh environment starts every 12 hours."
          echo
          echo "============================================================"
          echo

      - name: Keep ActionBoxVM running
        env:
          DISPLAY: :99
        run: |
          set -e

          while true; do

            if [ ! -f /tmp/actionboxvm-xvfb.pid ]; then
              echo "Xvfb PID file is missing."
              exit 1
            fi

            if ! kill -0 \
              "$(cat /tmp/actionboxvm-xvfb.pid)" \
              2>/dev/null; then

              echo "Xvfb stopped."
              exit 1
            fi

            if [ ! -f /tmp/actionboxvm-rfb.pid ]; then
              echo "VNC backend PID file is missing."
              exit 1
            fi

            if ! kill -0 \
              "$(cat /tmp/actionboxvm-rfb.pid)" \
              2>/dev/null; then

              echo "Local VNC backend stopped."
              exit 1
            fi

            if [ ! -f /tmp/actionboxvm-novnc.pid ]; then
              echo "noVNC PID file is missing."
              exit 1
            fi

            if ! kill -0 \
              "$(cat /tmp/actionboxvm-novnc.pid)" \
              2>/dev/null; then

              echo "noVNC stopped."
              exit 1
            fi

            if [ ! -f /tmp/actionboxvm-cloudflared.pid ]; then
              echo "Cloudflare PID file is missing."
              exit 1
            fi

            if ! kill -0 \
              "$(cat /tmp/actionboxvm-cloudflared.pid)" \
              2>/dev/null; then

              echo "Cloudflare Tunnel stopped."
              exit 1
            fi

            if [ ! -f /tmp/actionboxvm/screenshot-worker.pid ]; then
              echo "Screenshot worker PID file is missing."
              exit 1
            fi

            SCREENSHOT_PID="$(
              cat /tmp/actionboxvm/screenshot-worker.pid
            )"

            if ! kill -0 \
              "$SCREENSHOT_PID" \
              2>/dev/null; then

              echo "Screenshot worker stopped."

              echo
              echo "Screenshot worker log:"
              cat \
                /tmp/actionboxvm/screenshot-worker.log \
                2>/dev/null || true

              echo
              echo "Screenshot supervisor log:"
              cat \
                /tmp/actionboxvm/screenshot-supervisor.log \
                2>/dev/null || true

              exit 1
            fi

            sleep 60

          done